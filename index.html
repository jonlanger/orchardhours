<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Orchard Hours</title>
<style>
  :root{
    --ink:#3b2a1d; --ink-soft:#6b533f; --paper:#FBF3E2; --paper-2:#F3E6CD;
    --line:rgba(96,66,38,0.22); --accent:#C4553C; --accent-deep:#9E3F2B;
    --gold:#D9A441; --shadow:0 10px 30px rgba(70,45,22,0.18);
  }
  html, body { margin:0; padding:0; overflow:hidden; background:#EDE3CE;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; height:100%;
    -webkit-font-smoothing:antialiased; }
  canvas { display:block; touch-action:none; }
  #grain {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:0.05; mix-blend-mode:multiply;
  }
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(60,38,18,0.20) 100%); }

  #ui { position:fixed; inset:0; pointer-events:none; color:var(--ink); z-index:6; }
  .panel{ background:linear-gradient(180deg, rgba(255,250,238,0.94), rgba(248,237,216,0.92));
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    backdrop-filter: blur(6px) saturate(1.1); }

  /* ---- top bar ---- */
  .topleft{ position:absolute; top:14px; left:14px; display:flex; gap:8px; pointer-events:auto; }
  .btn{ font:inherit; font-size:14px; color:var(--ink); cursor:pointer;
    background:linear-gradient(180deg,#FFFAEF,#F0E1C4); border:1px solid var(--line);
    border-radius:12px; padding:9px 14px; box-shadow:0 3px 0 rgba(120,88,50,0.18), var(--shadow);
    display:flex; align-items:center; gap:8px; transition:transform .12s ease, box-shadow .12s ease, background .2s ease; }
  .btn:hover{ transform:translateY(-1px); background:linear-gradient(180deg,#FFFDF6,#F5E9D2); }
  .btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(120,88,50,0.18); }
  .btn .gl{ font-size:15px; line-height:1; }
  .btn.badge::after{ content:attr(data-badge); background:var(--accent-deep); color:#fff;
    font-size:11px; border-radius:9px; padding:1px 6px; margin-left:2px; letter-spacing:.02em; }

  .title{ position:absolute; top:16px; left:50%; transform:translateX(-50%); text-align:center; }
  .title{ background:linear-gradient(180deg, rgba(253,247,235,0.80), rgba(253,247,235,0));
    padding:6px 26px 16px; border-radius:0 0 22px 22px; }
  .title h1{ margin:0; font-size:clamp(17px,2.3vw,23px); font-weight:400; letter-spacing:0.07em;
    color:#4a3220; text-shadow:0 1px 0 rgba(255,255,255,0.6); }
  .title .sub{ font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ink-soft); opacity:.8; margin-top:3px; }

  /* ---- basket ---- */
  .basket{ position:absolute; top:12px; right:12px; padding:12px 14px 11px; min-width:196px; pointer-events:auto; }
  .basket-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ring{ width:38px; height:38px; flex-shrink:0; }
  .ring circle{ fill:none; stroke-width:5; stroke-linecap:round; }
  .ring .bg{ stroke:rgba(120,88,50,0.18); }
  .ring .fg{ stroke:var(--accent-deep); transition:stroke-dashoffset .45s cubic-bezier(.2,.8,.2,1); }
  .basket-head b{ font-weight:400; font-size:15px; display:block; }
  .basket-head span{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.06em; }
  .basket-row{ display:flex; align-items:center; gap:9px; font-size:13.5px; margin:5px 0; }
  .basket-row.dim{ opacity:.42; }
  .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 -2px 3px rgba(0,0,0,.22); }
  .count{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .count.bump{ animation:bump .45s ease; }
  @keyframes bump{ 0%{transform:scale(1)} 35%{transform:scale(1.5); color:var(--accent-deep)} 100%{transform:scale(1)} }

  .hint{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    font-size:clamp(12px,2vw,14.5px); color:#4a3220; padding:7px 16px; border-radius:20px;
    transition:opacity .6s ease; text-align:center; white-space:nowrap; }
  .toast{ position:absolute; top:74px; left:50%; transform:translateX(-50%) translateY(-8px);
    font-size:14px; padding:9px 18px; border-radius:20px; opacity:0; white-space:nowrap;
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---- overlays ---- */
  .overlay{ position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, rgba(60,40,20,0.34), rgba(34,22,12,0.62));
    backdrop-filter:blur(5px); pointer-events:auto; padding:20px; }
  .overlay.on{ display:flex; animation:fade .28s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .sheet{ width:min(780px, 96vw); max-height:88vh; min-height:min(500px, 78vh); overflow:hidden; display:flex; flex-direction:column;
    border-radius:20px; animation:rise .3s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(180deg,#FDF7EA 0%, #F7EBD4 100%);
    border:1px solid rgba(96,66,38,0.30);
    box-shadow:0 26px 70px rgba(30,18,8,0.45), inset 0 1px 0 rgba(255,255,255,0.7); }
  .sheet::before{ content:''; display:block; height:4px; flex:none;
    background:linear-gradient(90deg, var(--accent-deep), #D9A441 38%, #8FBF4F 68%, var(--accent-deep)); opacity:.75; }
  @keyframes rise{ from{transform:translateY(16px) scale(.98); opacity:0} to{transform:none; opacity:1} }
  .sheet-head{ padding:18px 22px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  .mark{ width:38px; height:38px; flex:none; }
  .sheet-head h2{ margin:0; font-weight:400; font-size:22px; letter-spacing:.04em; }
  .sheet-head p{ margin:3px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .x{ margin-left:auto; }
  .tabs{ display:flex; gap:6px; padding:12px 22px 0; border-bottom:1px solid var(--line); }
  .tab{ font:inherit; font-size:13.5px; padding:7px 14px; border-radius:11px 11px 0 0; cursor:pointer;
    border:1px solid transparent; border-bottom:none; background:transparent; color:var(--ink-soft); }
  .tab.on{ background:rgba(255,253,247,0.95); border-color:var(--line); color:var(--ink);
    box-shadow:inset 0 2px 0 var(--accent-deep); margin-bottom:-1px; }
  .tab:hover{ color:var(--ink); }
  .sheet-body{ padding:18px 22px 22px; overflow:auto; flex:1; }
  .sheet-body::-webkit-scrollbar{ width:9px } .sheet-body::-webkit-scrollbar-thumb{ background:rgba(120,88,50,.25); border-radius:9px }

  .menu-list{ display:flex; flex-direction:column; gap:9px; padding:20px 22px 24px; }
  .menu-item{ font:inherit; font-size:16px; text-align:left; padding:14px 18px; border-radius:14px; cursor:pointer;
    border:1px solid var(--line); background:linear-gradient(180deg,#FFFAEF,#F2E4C9); color:var(--ink);
    display:flex; align-items:center; gap:12px; transition:transform .12s ease, background .2s; }
  .menu-item:hover{ transform:translateX(3px); background:linear-gradient(180deg,#FFFDF7,#F7ECD6); }
  .menu-item small{ margin-left:auto; color:var(--ink-soft); font-size:12px; }

  .crates{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; }
  .crate{ border:1px solid var(--line); border-radius:14px; padding:12px 12px 10px; cursor:pointer;
    background:linear-gradient(180deg, rgba(255,253,247,.95), rgba(243,230,205,.8)); transition:transform .12s, box-shadow .2s; }
  .crate svg{ display:block; width:100%; height:auto; margin:2px 0 6px; }
  .crate.ready{ border-color:var(--accent-deep); box-shadow:0 0 0 1px rgba(158,63,43,.28); }
  .crate:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(70,45,22,.16); }
  .crate.empty{ cursor:default; }
  .crate.empty:hover{ transform:none; box-shadow:none; }
  .crate-top{ display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px; }
  .waiting{ display:flex; gap:3px; align-items:center; }
  .waiting b{ font-weight:400; font-size:11.5px; color:var(--accent-deep); }
  .crate-foot{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-top:7px; }
  .row-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .card{ border:1px solid var(--line); border-radius:14px; padding:14px 15px; background:rgba(255,252,244,.72); }
  .card.locked{ opacity:.45; }
  .card h3{ margin:0 0 6px; font-size:15px; font-weight:400; display:flex; align-items:center; gap:8px; }
  .card p{ margin:0; font-size:13px; line-height:1.55; color:var(--ink-soft); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  @media (max-width:560px){ .stat-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .stat{ border:1px solid var(--line); border-radius:14px; padding:14px; background:rgba(255,252,244,.72); text-align:center; }
  .stat b{ display:block; font-size:26px; font-weight:400; color:var(--accent-deep); font-variant-numeric:tabular-nums; }
  .stat span{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .toggle{ display:flex; align-items:center; gap:10px; font-size:14px; padding:11px 4px; border-bottom:1px dashed var(--line); }
  .toggle:last-child{ border-bottom:none; }
  .sw{ margin-left:auto; width:44px; height:25px; border-radius:14px; border:1px solid var(--line);
    background:rgba(120,88,50,.18); position:relative; cursor:pointer; transition:background .25s; }
  .sw i{ position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#FFFAEF;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .sw.on{ background:var(--accent-deep); } .sw.on i{ transform:translateX(19px); }
  .lede{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:0 0 14px; }

  /* ---- narrow screens: compact HUD, clock moves out of the way ---- */
  @media (max-width:620px){
    .topleft{ top:10px; left:10px; gap:6px; }
    .btn{ padding:8px 11px; font-size:13px; border-radius:11px; }
    .title{ top:auto; bottom:80px; background:none; padding:0; }
    .title h1{ display:none; }
    .title .sub{ font-size:10.5px; letter-spacing:.14em; }
    .basket{ top:10px; right:10px; min-width:0; padding:8px 11px;
      display:flex; align-items:center; gap:11px; }
    .basket-head{ margin:0; gap:8px; }
    .basket-head b{ font-size:13px; }
    .basket-head span{ font-size:10.5px; }
    .ring{ width:30px; height:30px; }
    .rows{ display:flex; gap:9px; }
    .basket-row{ flex-direction:column; align-items:center; gap:3px; margin:0; }
    .basket-row > span:nth-child(2){ display:none; }
    .count{ margin:0; font-size:12px; }
    .hint{ white-space:normal; max-width:86vw; bottom:16px; }
    .sheet-head{ padding:14px 16px 12px; gap:10px; }
    .sheet-head h2{ font-size:19px; }
    .tabs{ padding:10px 12px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .tab{ flex:none; font-size:13px; padding:7px 11px; }
    .sheet-body{ padding:14px 16px 18px; }
    .menu-list{ padding:14px 16px 18px; }
    .menu-item{ font-size:15px; padding:12px 14px; }
    .menu-item small{ display:none; }
  }
</style>
</head>
<body>
<div id="ui">
  <div class="topleft">
    <button class="btn" id="btnMenu"><span class="gl">☰</span> Menu</button>
    <button class="btn" id="btnBarn"><span class="gl">⌂</span> Barn</button>
  </div>
  <div class="title"><h1>Orchard Hours</h1><div class="sub" id="clock">Morning · Day 1</div></div>
  <div class="basket panel" id="basketPanel"></div>
  <div class="hint panel" id="hint">Tap an apple to pick it · tap the ground to walk</div>
  <div class="toast panel" id="toast"></div>
</div>

<div class="overlay" id="menuOverlay">
  <div class="sheet panel">
    <div class="sheet-head">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 11c-5 0-8 3.4-8 8.4C12 25 16 32 20 32s8-7 8-12.6C28 14.4 25 11 20 11z" fill="#C4553C"/>
        <path d="M20 11c0-3 1.6-5 4.4-5.6C24.6 8 23 10.6 20 11z" fill="#6FA24A"/>
        <rect x="19.3" y="6.5" width="1.5" height="5" rx="0.7" fill="#6B4A33"/>
      </svg>
      <div><h2>Orchard Hours</h2><p>A quiet season in the apple rows</p></div>
      <button class="btn x" id="menuClose">Close</button>
    </div>
    <div class="menu-list">
      <button class="menu-item" data-act="resume"><span>↩</span> Return to the orchard</button>
      <button class="menu-item" data-act="barn"><span>⌂</span> Go to the barn <small id="menuBarnHint"></small></button>
      <button class="menu-item" data-act="recenter"><span>◎</span> Recall the bear <small>bring Pom back to the gate</small></button>
      <button class="menu-item" data-act="settings"><span>⚙</span> Settings <small>quality &amp; comfort</small></button>
      <button class="menu-item" data-act="about"><span>❦</span> About this orchard</button>
    </div>
  </div>
</div>

<div class="overlay" id="barnOverlay">
  <div class="sheet panel">
    <div class="sheet-head">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 11c-5 0-8 3.4-8 8.4C12 25 16 32 20 32s8-7 8-12.6C28 14.4 25 11 20 11z" fill="#C4553C"/>
        <path d="M20 11c0-3 1.6-5 4.4-5.6C24.6 8 23 10.6 20 11z" fill="#6FA24A"/>
        <rect x="19.3" y="6.5" width="1.5" height="5" rx="0.7" fill="#6B4A33"/>
      </svg>
      <div><h2 id="barnTitle">The Barn</h2><p id="barnSub">Sort the day's picking, and read a little</p></div>
      <button class="btn x" id="barnClose">Back outside</button>
    </div>
    <div class="tabs" id="barnTabs">
      <button class="tab on" data-tab="sort">Sorting</button>
      <button class="tab" data-tab="almanac">Almanac</button>
      <button class="tab" data-tab="ledger">Ledger</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>
    <div class="sheet-body" id="barnBody"></div>
  </div>
</div>

<div id="vignette"></div>
<div id="grain"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

/* ============================================================
   ORCHARD HOURS — config
   ============================================================ */
const APPLE_TYPES = {
  honeycrisp:  { color:0xC63B2E, blush:0x8E2A22, label:'Honeycrisp',       crate:'#C63B2E',
    note:'Bred in Minnesota in the 1960s and released in 1991. Its cells are unusually large and rupture when bitten, which is why it shatters instead of yielding.' },
  grannysmith: { color:0x8FBF4F, blush:0x6B9A38, label:'Granny Smith',     crate:'#8FBF4F',
    note:'A chance seedling found by Maria Ann Smith in Australia around 1868. It keeps for months in cold storage, which is why it once travelled the world.' },
  golden:      { color:0xE2C452, blush:0xC29A34, label:'Golden Delicious', crate:'#E2C452',
    note:'A parent of more modern varieties than almost any other apple. Thin-skinned, so orchards pick it by hand and never tip it into a bin.' },
  rare:        { color:0xF3C63B, blush:0xD9A020, label:'Amber Russet',     crate:'#F3C63B', shine:true,
    note:'A rough-skinned heirloom that most packing houses reject on looks alone. Growers keep a few trees for themselves; the flavour is nutty and dense.' },
};
const TYPE_KEYS = Object.keys(APPLE_TYPES);
const TYPE_WEIGHTS = [['honeycrisp',0.34],['grannysmith',0.29],['golden',0.31],['rare',0.06]];
const BASKET_CAPACITY = 24;
const CRATE_CAPACITY  = 60;

/* orchard planting plan — real rows */
const ROWS = 4, PER_ROW = 5;
const ROW_SPACING = 13.0;   // between rows (z)
const TREE_SPACING = 9.0;   // within a row (x)

/* ============================================================
   Renderer / scene / camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xBFDCE8, 52, 165);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 220);
function updateCameraFov(){
  const a = innerWidth/innerHeight;
  camera.aspect = a;
  camera.fov = a < 0.8 ? 56 : 44;
  camera.updateProjectionMatrix();
}
updateCameraFov();

/* ============================================================
   Sky dome — gradient + soft sun, drifts with the hour
   ============================================================ */
const skyUniforms = {
  uTop:    { value:new THREE.Color(0x6FA9CE) },
  uHorizon:{ value:new THREE.Color(0xD8E6EC) },
  uGround: { value:new THREE.Color(0xC8BFA4) },
  uSunDir: { value:new THREE.Vector3(0.5,0.6,0.4).normalize() },
  uSunCol: { value:new THREE.Color(0xFFF0CE) },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(150, 32, 20),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyUniforms,
    vertexShader:`varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vP;
      uniform vec3 uTop,uHorizon,uGround,uSunDir,uSunCol;
      void main(){
        vec3 d = normalize(vP);
        float h = d.y;
        vec3 col = mix(uHorizon, uTop, clamp(pow(max(h,0.0),0.55),0.0,1.0));
        col = mix(col, uGround, clamp(-h*3.0,0.0,1.0));
        float sun = max(dot(d, normalize(uSunDir)), 0.0);
        col += uSunCol * (pow(sun, 220.0)*0.9 + pow(sun, 8.0)*0.22);
        gl_FragColor = vec4(col,1.0);
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ============================================================
   Lighting
   ============================================================ */
const key = new THREE.DirectionalLight(0xfff1d8, 2.5);
key.position.set(14, 20, 11);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const SH = 26;
key.shadow.camera.left=-SH; key.shadow.camera.right=SH;
key.shadow.camera.top=SH;  key.shadow.camera.bottom=-SH;
key.shadow.camera.near=1;  key.shadow.camera.far=70;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const hemi = new THREE.HemisphereLight(0xffe9c7, 0x6b8f5a, 0.72);
scene.add(hemi);
const bounce = new THREE.DirectionalLight(0xBFD8E8, 0.5);
bounce.position.set(-9, 5, -8);
scene.add(bounce);
scene.add(new THREE.AmbientLight(0xE8F0DC, 0.28));   // keeps the shade under the canopies readable

/* ============================================================
   Toon helpers
   ============================================================ */
function makeToonGradient(steps){
  const c = document.createElement('canvas'); c.width = steps.length; c.height = 1;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(steps.length, 1);
  steps.forEach((v,i)=>{ img.data[i*4]=v; img.data[i*4+1]=v; img.data[i*4+2]=v; img.data[i*4+3]=255; });
  ctx.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  return t;
}
const toonGradient  = makeToonGradient([88,150,208,255]);
const toonSoft      = makeToonGradient([120,168,206,232,255]);
const matCache = new Map();
function toonMat(color, soft=false){
  const k = color+'|'+soft;
  if(!matCache.has(k)) matCache.set(k, new THREE.MeshToonMaterial({ color, gradientMap: soft?toonSoft:toonGradient }));
  return matCache.get(k);
}
const outlineMats = new Map();
function outlineMat(color){
  if(!outlineMats.has(color)) outlineMats.set(color, new THREE.MeshBasicMaterial({ color, side:THREE.BackSide }));
  return outlineMats.get(color);
}
const outlines = [];
function addOutline(mesh, scale=1.05, color=0x2f2016){
  const o = new THREE.Mesh(mesh.geometry, outlineMat(color));
  o.scale.setScalar(scale);
  o.renderOrder = -1;
  mesh.add(o);
  outlines.push(o);
  return o;
}

/* ============================================================
   Ground — gentle swells plus mown lanes between the rows
   ============================================================ */
const GROUND_SIZE = 170;
function groundHeightAt(x,z){
  return Math.sin(x*0.11)*0.22 + Math.cos(z*0.09)*0.20 + Math.sin((x+z)*0.06)*0.14;
}
/* z of each planted row */
const rowZ = [];
for(let r=0;r<ROWS;r++) rowZ.push((r - (ROWS-1)/2) * ROW_SPACING);

function buildGround(){
  const geo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 150, 150);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const grass = new THREE.Color(0x89B457);   // alley
  const mown  = new THREE.Color(0x9CC468);   // freshly cut centre of the alley
  const dirt  = new THREE.Color(0x9A8158);   // bare strip kept under the trees
  const c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, groundHeightAt(x,z));
    let d = 1e9;
    for(const rz of rowZ) d = Math.min(d, Math.abs(z - rz));
    const inOrchard = Math.abs(x) < PER_ROW*TREE_SPACING/2 + 3.5;
    if(inOrchard && d < 1.5){
      c.copy(dirt).lerp(grass, Math.pow(d/1.5, 2.2));       // strip feathers into the grass
    } else if(inOrchard && d < 4.4){
      c.copy(mown);
      c.offsetHSL(0, 0, Math.sin(z*2.2)*0.016);             // mower stripes
    } else {
      c.copy(grass);
    }
    c.offsetHSL(0, (Math.random()-0.5)*0.035, (Math.random()-0.5)*0.045);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  geo.computeVertexNormals();
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  const m = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors:true, gradientMap:toonSoft }));
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

const BRANCH_GEO = new THREE.CylinderGeometry(0.62, 1, 1, 6, 1);

const TRUNK_GEO = new THREE.CylinderGeometry(0.22, 0.34, 1, 10, 4);
TRUNK_GEO.translate(0, 0.5, 0);
(function flareTrunk(){                              // root flare + a little sway
  const p = TRUNK_GEO.attributes.position;
  for(let i=0;i<p.count;i++){
    const y=p.getY(i), x=p.getX(i), z=p.getZ(i);
    const flare = 1 + Math.pow(1-y, 5)*0.55;
    const lean  = Math.sin(y*3.1)*0.045;
    p.setX(i, x*flare + lean); p.setZ(i, z*flare);
  }
  TRUNK_GEO.computeVertexNormals();
})();

/* three lumpy canopy shapes so no two blobs read identical */
const CANOPY_GEOS = [0,1,2].map(()=>{
  const g = new THREE.IcosahedronGeometry(1, 2);
  const p = g.attributes.position, v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n = Math.sin(v.x*3.1)*Math.cos(v.y*2.7)*Math.sin(v.z*3.3);
    v.multiplyScalar(1 + n*0.16 + (Math.random()-0.5)*0.05);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
});

/* ---- the apple: lobed body, dimpled crown, stem, leaf, calyx ---- */
const APPLE_GEO = (function(){
  const g = new THREE.SphereGeometry(1, 18, 14);
  const p = g.attributes.position, v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const theta = Math.atan2(v.z, v.x);
    const lobe = 1 + Math.cos(theta*5)*0.035;          // five soft lobes
    v.x *= lobe; v.z *= lobe;
    v.y *= 0.90;                                       // squat
    const r = Math.hypot(v.x, v.z);
    const ny = v.y/0.90;
    if(ny > 0.45) v.y -= (ny-0.45)*0.62*Math.max(0, 1 - r/0.62);   // stem well
    if(ny < -0.55) v.y += (-ny-0.55)*0.40*Math.max(0, 1 - r/0.5);  // calyx dimple
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
})();

const STEM_MAT = toonMat(0x6B4A33);
const LEAF_MAT = toonMat(0x6FA24A);
const HILITE_MAT = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.30 });
const BARK_MAT = toonMat(0x8A6544, true);
const BARK_DARK = toonMat(0x6E4C34, true);

const APPLE_SCALE = 0.19;
function buildApple(type){
  const def = APPLE_TYPES[type];
  const g = new THREE.Group();
  const body = new THREE.Mesh(APPLE_GEO, appleMats[type]);
  body.castShadow = true;
  g.add(body);
  // blushed cheek — a slightly smaller offset shell reading as sun-side colour
  const cheek = new THREE.Mesh(APPLE_GEO, appleBlushMats[type]);
  cheek.scale.setScalar(1.008);
  cheek.position.set(0.16, 0.02, 0.10);
  cheek.scale.multiplyScalar(0.86);
  g.add(cheek);
  const hi = new THREE.Mesh(SPECK_GEO, HILITE_MAT);
  hi.scale.set(0.30, 0.20, 0.16);
  hi.position.set(-0.42, 0.52, 0.55);
  g.add(hi);
  const stem = new THREE.Mesh(STEM_GEO, STEM_MAT);
  stem.position.y = 0.72; stem.rotation.z = 0.22; stem.rotation.x = 0.1;
  g.add(stem);
  const leaf = new THREE.Mesh(LEAF_GEO, LEAF_MAT);
  leaf.position.set(0.30, 1.02, 0.04);
  leaf.rotation.set(0.2, 0.5, -0.55);
  g.add(leaf);
  g.scale.setScalar(APPLE_SCALE);
  return g;
}

/* ============================================================
   Trees — trunk, recursive limbs, layered canopy, hung fruit
   ============================================================ */
const apples = [];
const trees = [];

function pickType(){
  let r = Math.random(), acc = 0;
  for(const [k,w] of TYPE_WEIGHTS){ acc += w; if(r <= acc) return k; }
  return 'honeycrisp';
}
const UP = new THREE.Vector3(0,1,0);
function orient(mesh, dir){ mesh.quaternion.setFromUnitVectors(UP, dir.clone().normalize()); }

function growLimb(group, origin, dir, len, rad, depth, tips){
  const m = new THREE.Mesh(BRANCH_GEO, depth > 1 ? BARK_MAT : BARK_DARK);
  m.position.copy(origin);
  orient(m, dir);
  m.scale.set(rad, len, rad);
  m.castShadow = true;
  if(depth >= 2) addOutline(m, 1.14, 0x33231a);
  group.add(m);

  const end = origin.clone().addScaledVector(dir.clone().normalize(), len);
  if(depth <= 0){ tips.push({ pos:end, dir:dir.clone().normalize() }); return; }

  const forks = depth >= 2 ? 2 + (Math.random() < 0.5 ? 1 : 0) : 2;
  for(let i=0;i<forks;i++){
    const axis = new THREE.Vector3(Math.random()-0.5, Math.random()*0.2, Math.random()-0.5).normalize();
    const nd = dir.clone().applyAxisAngle(axis, 0.42 + Math.random()*0.42);
    nd.y = Math.max(nd.y, 0.12);                 // limbs keep reaching upward
    nd.normalize();
    growLimb(group, end, nd, len*(0.66+Math.random()*0.14), rad*0.66, depth-1, tips);
  }
}

function buildTree(x, z, scale){
  const g = new THREE.Group();
  g.position.set(x, groundHeightAt(x,z), z);
  g.rotation.y = Math.random()*Math.PI*2;

  const trunkH = 3.15*scale;
  const trunk = new THREE.Mesh(TRUNK_GEO, BARK_MAT);
  trunk.scale.set(scale, trunkH, scale);
  trunk.castShadow = true; trunk.receiveShadow = true;
  addOutline(trunk, 1.05, 0x33231a);
  g.add(trunk);

  /* upper scaffolds carry the main canopy */
  const tips = [];
  const crotch = new THREE.Vector3(0, trunkH*0.90, 0);
  for(let i=0;i<4;i++){
    const a = (i/4)*Math.PI*2 + Math.random()*0.4;
    const spread = 0.60 + Math.random()*0.30;
    const dir = new THREE.Vector3(Math.cos(a)*spread, 1, Math.sin(a)*spread).normalize();
    growLimb(g, crotch, dir, 1.45*scale, 0.19*scale, 2, tips);
  }

  const hue = (Math.random()-0.5)*0.05;
  const canopyColor = new THREE.Color(0x6FA24A).offsetHSL(0, hue, (Math.random()-0.5)*0.06).getHex();
  const canopyMat = new THREE.MeshToonMaterial({ color:canopyColor, gradientMap:toonSoft });
  const canopyDeep = new THREE.MeshToonMaterial({
    color:new THREE.Color(canopyColor).offsetHSL(0.02,0,-0.09).getHex(), gradientMap:toonSoft });

  const core = new THREE.Mesh(CANOPY_GEOS[0], canopyDeep);
  core.position.y = trunkH + 2.2*scale;
  core.scale.set(1.95*scale, 1.75*scale, 1.95*scale);
  core.castShadow = true; core.receiveShadow = true;
  addOutline(core, 1.018);
  g.add(core);

  for(const t of tips){
    const b = new THREE.Mesh(CANOPY_GEOS[Math.floor(Math.random()*3)], Math.random()<0.5?canopyMat:canopyDeep);
    b.position.copy(t.pos).addScaledVector(t.dir, 0.30*scale);
    const sc = (0.72 + Math.random()*0.36)*scale;
    b.scale.set(sc*1.2, sc*0.92, sc*1.2);
    b.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    b.castShadow = true; b.receiveShadow = true;
    addOutline(b, 1.022);
    g.add(b);
  }

  /* --- low fruiting limbs: what a picker on the ground actually works --- */
  const spots = [];
  const nLow = 4 + Math.floor(Math.random()*2);
  for(let i=0;i<nLow;i++){
    const a = (i/nLow)*Math.PI*2 + Math.random()*0.5;
    const len = (1.35 + Math.random()*0.4)*scale;
    const dir = new THREE.Vector3(Math.cos(a), 0.42 + Math.random()*0.2, Math.sin(a)).normalize();
    const base = new THREE.Vector3(0, (1.35 + Math.random()*0.45)*scale, 0);

    const limb = new THREE.Mesh(BRANCH_GEO, BARK_MAT);
    limb.position.copy(base);
    orient(limb, dir);
    limb.scale.set(0.085*scale, len, 0.085*scale);
    limb.castShadow = true;
    addOutline(limb, 1.16, 0x33231a);
    g.add(limb);

    const tip = base.clone().addScaledVector(dir, len);
    // a spur of leaves at the end of the limb
    const leafy = new THREE.Mesh(CANOPY_GEOS[i%3], canopyMat);
    leafy.position.copy(tip).add(new THREE.Vector3(0, 0.30*scale, 0));
    const ls = (0.55 + Math.random()*0.20)*scale;
    leafy.scale.set(ls*1.25, ls*0.85, ls*1.25);
    leafy.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    leafy.castShadow = true;
    addOutline(leafy, 1.03);
    g.add(leafy);

    const n = 2 + Math.floor(Math.random()*2);
    for(let j=0;j<n;j++){
      spots.push(new THREE.Vector3(
        tip.x + (Math.random()-0.5)*0.9*scale,
        tip.y - (0.10 + Math.random()*0.35)*scale,
        tip.z + (Math.random()-0.5)*0.9*scale));
    }
  }
  /* plus whatever hangs low off the main canopy's skirt */
  const skirtY = core.position.y - core.scale.y*0.90;
  if(skirtY < 3.4*scale){
    for(let i=0;i<5;i++){
      const a = Math.random()*Math.PI*2, rr = core.scale.x*(0.6+Math.random()*0.25);
      spots.push(new THREE.Vector3(Math.cos(a)*rr, skirtY - Math.random()*0.35, Math.sin(a)*rr));
    }
  }

  const used = [];
  for(const p of spots){
    if(p.y > 3.3 || p.y < 1.15) continue;
    if(used.some(u => u.distanceTo(p) < 0.48*scale)) continue;
    used.push(p);

    const type = pickType();
    const fruit = buildApple(type);
    fruit.position.copy(p);
    fruit.rotation.y = Math.random()*Math.PI*2;
    g.add(fruit);

    const twig = new THREE.Mesh(BRANCH_GEO, BARK_DARK);
    twig.position.copy(p).add(new THREE.Vector3(0, 0.12, 0));
    orient(twig, new THREE.Vector3((Math.random()-0.5)*0.5, 1, (Math.random()-0.5)*0.5));
    twig.scale.set(0.020*scale, 0.26*scale, 0.020*scale);
    g.add(twig);

    apples.push({
      group: fruit, type, picked:false, treeGroup:g,
      standPoint:null, anim:null, sway:Math.random()*Math.PI*2, home:p.clone()
    });
  }

  // everything the fade-out needs: the leaf materials, the ink hulls, and the canopy height
  const treeOutlines = [];
  g.traverse(o => { if(o.isMesh && o.material && o.material.side === THREE.BackSide) treeOutlines.push(o); });
  g.userData = { canopyMats:[canopyMat, canopyDeep], outlines:treeOutlines,
                 canopyY:core.position.y, canopyR:core.scale.x*1.55, fade:1 };

  scene.add(g);
  trees.push(g);
  return g;
}

/* --- plant the rows --- */
for(let r=0;r<ROWS;r++){
  for(let i=0;i<PER_ROW;i++){
    const x = (i - (PER_ROW-1)/2) * TREE_SPACING + (Math.random()-0.5)*0.5;
    const z = rowZ[r] + (Math.random()-0.5)*0.5;
    buildTree(x, z, 0.95 + Math.random()*0.25);
  }
}

/* stand points: where the bear plants its feet to reach each apple */
scene.updateMatrixWorld(true);
const _wp = new THREE.Vector3();
for(const a of apples){
  a.group.getWorldPosition(_wp);
  const tp = a.treeGroup.position;
  const flat = new THREE.Vector3(_wp.x - tp.x, 0, _wp.z - tp.z);
  if(flat.lengthSq() < 1e-4) flat.set(1,0,0);
  flat.normalize().multiplyScalar(0.85);
  const sx = tp.x + flat.x + (_wp.x - tp.x)*0.55;
  const sz = tp.z + flat.z + (_wp.z - tp.z)*0.55;
  a.standPoint = new THREE.Vector3(sx, groundHeightAt(sx,sz), sz);
  a.worldPos = _wp.clone();
}

function fenceRun(x1,z1,x2,z2){
  const len = Math.hypot(x2-x1, z2-z1);
  const n = Math.round(len/2.6);
  for(let i=0;i<=n;i++){
    const t = i/n, x = x1+(x2-x1)*t, z = z1+(z2-z1)*t;
    const p = new THREE.Mesh(POST_GEO, FENCE_MAT);
    p.position.set(x, groundHeightAt(x,z)+0.55, z);
    p.rotation.y = Math.atan2(x2-x1, z2-z1);
    p.castShadow = true; FENCE.add(p);
    if(i<n){
      const nx = x1+(x2-x1)*((i+1)/n), nz = z1+(z2-z1)*((i+1)/n);
      for(const yy of [0.78, 0.44]){
        const r = new THREE.Mesh(RAIL_GEO, FENCE_MAT_D);
        r.position.set((x+nx)/2, (groundHeightAt(x,z)+groundHeightAt(nx,nz))/2 + yy, (z+nz)/2);
        r.scale.x = Math.hypot(nx-x, nz-z)*1.02;
        r.rotation.y = Math.atan2(nx-x, nz-z) + Math.PI/2;
        r.castShadow = true; FENCE.add(r);
      }
    }
  }
}

const SAVE_KEY = 'orchardhours.save.v2';
const state = {
  basket:  { honeycrisp:0, grannysmith:0, golden:0, rare:0 },
  stored:  { honeycrisp:0, grannysmith:0, golden:0, rare:0 },
  discovered: {},
  picked: 0, deposited: 0, day: 1, dayT: 0.34,
  settings: { shadows:true, outlines:true, petals:true, calm:false }
};
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    stored:state.stored, discovered:state.discovered, picked:state.picked,
    deposited:state.deposited, day:state.day, settings:state.settings })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state.stored, d.stored||{});
    Object.assign(state.discovered, d.discovered||{});
    Object.assign(state.settings, d.settings||{});
    state.picked = d.picked||0; state.deposited = d.deposited||0; state.day = d.day||1;
  }catch(e){}
}

/* ============================================================
   Interaction
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let moveTarget = null, queuedApple = null, queuedBarn = false;
let walkT = 0, hop = 0, hopV = 0;
const WALK_SPEED = 3.1, ARRIVE_EPS = 0.14;
const overlayOpen = () => document.querySelector('.overlay.on') !== null;

function ownerApple(obj){
  let o = obj;
  while(o){ const found = apples.find(a => a.group === o); if(found) return found; o = o.parent; }
  return null;
}
const barnFacing = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), barn.rotation.y);
const barnDoorPoint = BARN_POS.clone().addScaledVector(barnFacing, D/2 + 2.8);
barnDoorPoint.y = groundHeightAt(barnDoorPoint.x, barnDoorPoint.z);

function onPointerDown(e){
  if(overlayOpen()) return;
  if(e.target !== renderer.domElement) return;   // clicks on the UI are not clicks on the world
  ndc.x = (e.clientX/innerWidth)*2 - 1;
  ndc.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const live = apples.filter(a => !a.picked).map(a => a.group);
  const hitApple = raycaster.intersectObjects(live, true)[0];
  const hitBarn  = raycaster.intersectObject(barn, true)[0];
  const hitGround = raycaster.intersectObject(groundMesh)[0];

  const dA = hitApple ? hitApple.distance : Infinity;
  const dB = hitBarn ? hitBarn.distance : Infinity;

  if(dA < dB && hitApple){
    if(basketTotal() >= BASKET_CAPACITY){ toast('The basket will not hold another — take it to the barn'); return; }
    const a = ownerApple(hitApple.object);
    if(a){ queuedApple = a; queuedBarn = false; moveTarget = a.standPoint.clone(); hideHint(); }
    return;
  }
  if(dB < dA && hitBarn){
    queuedBarn = true; queuedApple = null;
    moveTarget = barnDoorPoint.clone();
    hideHint();
    return;
  }
  if(hitGround){
    moveTarget = hitGround.point.clone();
    queuedApple = null; queuedBarn = false;
    hideHint();
  }
}
addEventListener('pointerdown', onPointerDown);

/* keep the bear from strolling through trunks */
function avoidTrunks(p){
  for(const t of trees){
    const dx = p.x - t.position.x, dz = p.z - t.position.z;
    const d = Math.hypot(dx, dz);
    if(d < 0.85 && d > 1e-4){
      p.x = t.position.x + dx/d*0.85;
      p.z = t.position.z + dz/d*0.85;
    }
  }
  p.x = Math.max(FX1+1.2, Math.min(FX2-1.2, p.x));
  p.z = Math.max(FZ1+1.2, Math.min(FZ2-1.2, p.z));
}

   Picking
   ============================================================ */
const _basketWorld = new THREE.Vector3();
function startPick(a){
  const dir = new THREE.Vector3().subVectors(a.worldPos, character.position);
  a.anim = { phase:'reach', t:0, face:Math.atan2(dir.x, dir.z) };
  hopV = 2.1;
}
function finishPick(a){
  state.basket[a.type]++;
  state.picked++;
  if(!state.discovered[a.type]){
    state.discovered[a.type] = true;
    toast(`A new variety — ${APPLE_TYPES[a.type].label}. The almanac has a page on it.`);
  } else if(a.type === 'rare'){
    toast('An Amber Russet. Rough-skinned and worth more than it looks.');
  }
  renderBasket(a.type);
  updateBasketFruit();
  save();
  if(basketTotal() >= BASKET_CAPACITY) toast('Basket full — the barn is expecting you');
}
function updateBasketFruit(){
  const n = basketTotal();
  const order = [];
  for(const k of TYPE_KEYS) for(let i=0;i<state.basket[k];i++) order.push(k);
  rig.basketFruit.forEach((f,i)=>{
    const show = i < Math.min(7, n);
    f.visible = show;
    if(show) f.material = appleMats[order[Math.floor(i*order.length/Math.min(7,n))] || 'honeycrisp'];
  });
}
updateBasketFruit();

$('menuClose').onclick = closeOverlays;
$('btnBarn').onclick = ()=> openBarn('sort');
$('barnClose').onclick = ()=>{ closeOverlays(); };
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('pointerdown', e => { if(e.target === o) closeOverlays(); }));
addEventListener('keydown', e => {
  if(e.key === 'Escape'){ overlayOpen() ? closeOverlays() : $('btnMenu').click(); }
  if(e.key.toLowerCase() === 'b' && !overlayOpen()) openBarn('sort');
});

document.querySelectorAll('#menuOverlay .menu-item').forEach(b => b.onclick = ()=>{
  const act = b.dataset.act;
  closeOverlays();
  if(act === 'barn') openBarn('sort');
  if(act === 'settings') openBarn('settings');
  if(act === 'about') openBarn('about');
  if(act === 'recenter'){
    moveTarget = new THREE.Vector3(4, groundHeightAt(4,27), 27);
    queuedApple = null; queuedBarn = false;
  }
});

let barnTab = 'sort';
function openBarn(tab){
  barnTab = tab || 'sort';
  openOverlay('barnOverlay');
  document.querySelectorAll('#barnTabs .tab').forEach(t => t.classList.toggle('on', t.dataset.tab === barnTab));
  renderBarn();
}
document.querySelectorAll('#barnTabs .tab').forEach(t => t.onclick = ()=> openBarn(t.dataset.tab));

const LORE = [
  { title:'Why the rows run straight', need:()=>true,
    body:'Orchards are planted in rows so every tree gets the same light and the same air. Rows set north to south give both sides of a tree an even share of the sun, and the gap between them — the alley — is sized for whatever has to drive down it.' },
  { title:'Every apple is a clone', need:()=> state.picked >= 8,
    body:'Plant a seed from a Honeycrisp and you get something else entirely; apples do not come true from seed. Every Honeycrisp on earth is a cutting from one 1960s seedling, grafted onto other roots.' },
  { title:'Taking fruit off on purpose', need:()=> state.picked >= 20,
    body:'Growers thin the young fruit in early summer, pulling off perfectly good apples. Left alone a tree over-crops, sizes everything down, and exhausts itself into bearing only every other year.' },
  { title:'Two trees, or none', need:()=> varietiesFound() >= 3,
    body:'Most apples cannot pollinate themselves. A block of one variety sets almost nothing, so orchards interplant a second variety that blooms at the same time, and keep bees within flying distance of both.' },
  { title:'Sleeping through the winter', need:()=> state.deposited >= 20,
    body:'Cold storage slows an apple down; controlled-atmosphere storage nearly stops it, dropping the oxygen until the fruit barely breathes. It is why an apple picked in October is crisp the following June.' },
];

function renderBarn(){
  const body = $('barnBody'), head = $('barnSub');
  if(barnTab === 'sort'){
    head.textContent = 'Empty the basket into the crates';
    const n = basketTotal();
    let html = `<p class="lede">${n ? `You are carrying <b>${n}</b> ${n===1?'apple':'apples'}. Tip each variety into its own crate — the barn keeps a running count for the season.` : 'The basket is empty. Head back out to the rows and fill it.'}</p><div class="crates">`;
    for(const k of TYPE_KEYS){
      const def = APPLE_TYPES[k], have = state.basket[k], has = state.stored[k];
      const frac = Math.min(1, has/CRATE_CAPACITY);
      const shown = has ? Math.max(1, Math.round(frac*14)) : 0;
      let fruit = '';
      for(let i=0;i<shown;i++){
        const cx = 12 + (i%5)*22 + ((i/5|0)%2)*8;
        const cy = 30 - (i/5|0)*11;
        fruit += `<circle cx="${cx}" cy="${cy}" r="8" fill="${def.crate}"/>
                  <circle cx="${cx-2.5}" cy="${cy-3}" r="2.4" fill="#fff" opacity=".35"/>`;
      }
      let dots = '';
      for(let i=0;i<Math.min(have,10);i++) dots += `<span class="dot" style="width:8px;height:8px;background:${def.crate}"></span>`;
      html += `<div class="crate${have?' ready':' empty'}" data-crate="${k}">
        <div class="crate-top"><span class="dot" style="background:${def.crate}"></span>
          ${state.discovered[k] ? def.label : 'Unlabelled crate'}</div>
        <svg viewBox="0 0 120 62" aria-hidden="true">
          <rect x="8" y="14" width="104" height="30" rx="2" fill="#9C7340" opacity=".55"/>
          <g>${fruit}</g>
          <rect x="2" y="30" width="116" height="30" rx="3" fill="#B98A50" stroke="#7E5A31" stroke-width="1.5"/>
          <rect x="2" y="36.5" width="116" height="4" fill="#8E6636" opacity=".45"/>
          <rect x="2" y="46"   width="116" height="4" fill="#8E6636" opacity=".45"/>
          <rect x="6" y="30" width="7" height="30" fill="#8E6636" opacity=".5"/>
          <rect x="107" y="30" width="7" height="30" fill="#8E6636" opacity=".5"/>
        </svg>
        <div class="crate-foot"><span>${has} of ${CRATE_CAPACITY}</span>
          <span class="waiting">${dots}${have>10?'<b>+'+(have-10)+'</b>':''}${have?'':'—'}</span></div>
      </div>`;
    }
    html += `</div><div class="row-actions">
      <button class="btn" id="depositAll">Tip everything in</button>
      <button class="btn" id="goOut">Back to the rows</button></div>`;
    body.innerHTML = html;
    body.querySelectorAll('.crate').forEach(c => c.onclick = ()=> deposit(c.dataset.crate));
    $('depositAll').onclick = ()=> deposit(null);
    $('goOut').onclick = closeOverlays;
  }
  else if(barnTab === 'almanac'){
    head.textContent = 'What the orchard teaches, a page at a time';
    let html = '<p class="lede">Varieties open as you pick them. The longer pages open as the season goes on.</p><div class="cards">';
    for(const k of TYPE_KEYS){
      const def = APPLE_TYPES[k], seen = state.discovered[k];
      html += `<div class="card${seen?'':' locked'}">
        <h3><span class="dot" style="background:${def.crate}"></span>${seen?def.label:'Not yet picked'}</h3>
        <p>${seen?def.note:'Pick one from the rows to open this page.'}</p></div>`;
    }
    for(const l of LORE){
      const ok = l.need();
      html += `<div class="card${ok?'':' locked'}"><h3>❦ ${ok?l.title:'A page still folded'}</h3>
        <p>${ok?l.body:'Keep picking and storing; this page opens later in the season.'}</p></div>`;
    }
    body.innerHTML = html + '</div>';
  }
  else if(barnTab === 'ledger'){
    head.textContent = 'The season so far';
    body.innerHTML = `<div class="stat-grid">
      <div class="stat"><b>${state.picked}</b><span>Picked</span></div>
      <div class="stat"><b>${storedTotal()}</b><span>In the barn</span></div>
      <div class="stat"><b>${basketTotal()}</b><span>In hand</span></div>
      <div class="stat"><b>${varietiesFound()}/${TYPE_KEYS.length}</b><span>Varieties</span></div>
      <div class="stat"><b>${state.stored.rare}</b><span>Russets kept</span></div>
      <div class="stat"><b>${state.day}</b><span>Day</span></div>
    </div>
    <p class="lede" style="margin-top:16px">${ROWS} rows of ${PER_ROW} trees, ${apples.length} apples set this season. ${apples.filter(a=>!a.picked).length} still on the branch.</p>`;
  }
  else if(barnTab === 'settings'){
    head.textContent = 'Quality and comfort';
    const sw = (k,label,desc) => `<div class="toggle"><div>${label}<div style="font-size:11.5px;color:var(--ink-soft)">${desc}</div></div>
      <div class="sw${state.settings[k]?' on':''}" data-set="${k}"><i></i></div></div>`;
    body.innerHTML =
      sw('shadows','Cast shadows','Softer light, heavier on older machines') +
      sw('outlines','Ink outlines','The drawn-in-pen look around every shape') +
      sw('petals','Drifting petals','Blossom and leaves on the breeze') +
      sw('calm','Calm motion','Slows the sway, the wind, and the camera') +
      `<div class="row-actions"><button class="btn" id="resetSeason">Start a fresh season</button></div>`;
    body.querySelectorAll('.sw').forEach(el => el.onclick = ()=>{
      const k = el.dataset.set;
      state.settings[k] = !state.settings[k];
      applySettings(); save(); renderBarn();
    });
    $('resetSeason').onclick = ()=>{
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      TYPE_KEYS.forEach(k=>{ state.stored[k]=0; state.basket[k]=0; });
      state.discovered = {}; state.picked = 0; state.deposited = 0; state.day = 1;
      renderBasket(); updateBasketFruit(); renderBarn();
      toast('A fresh season. The trees have set new fruit.');
      apples.forEach(a => { if(a.picked){ a.picked=false; a.group.visible=true; a.group.scale.setScalar(APPLE_SCALE); a.group.position.copy(a.home); } });
    };
  }
  else if(barnTab === 'about'){
    head.textContent = 'About';
    body.innerHTML = `<p class="lede">Orchard Hours is a small, slow game about picking apples in a planted orchard and putting them away properly.</p>
      <div class="cards">
        <div class="card"><h3>Out in the rows</h3><p>Tap an apple and Pom walks over and picks it. Tap the ground to wander. Tap the barn — or press <b>B</b> — to go inside.</p></div>
        <div class="card"><h3>In the barn</h3><p>Tip the basket into the crates, read the almanac, and check the ledger. <b>Esc</b> opens the menu.</p></div>
      </div>`;
  }
}
function deposit(only){
  let moved = 0;
  for(const k of TYPE_KEYS){
    if(only && k !== only) continue;
    moved += state.basket[k];
    state.stored[k] += state.basket[k];
    state.basket[k] = 0;
  }
  if(!moved){ return; }
  state.deposited += moved;
  renderBasket(); updateBasketFruit(); renderBarn(); save();
  toast(`${moved} ${moved===1?'apple':'apples'} into the crates`);
}

function applySettings(){
  const s = state.settings;
  renderer.shadowMap.enabled = s.shadows;
  scene.traverse(o => { if(o.isMesh && o.material) o.material.needsUpdate = true; });
  outlines.forEach(o => o.visible = s.outlines);
  trees.forEach(t => t.userData.outlines.forEach(o => o.visible = s.outlines && t.userData.fade > 0.9));
  petals.visible = s.petals;
}
applySettings();

/* ============================================================
   Time of day
   ============================================================ */
const DAY_LENGTH = 420;
const PHASES = [
  { t:0.00, name:'Early morning', top:0x7FA8C9, hor:0xF0DCC4, sun:0xFFD9A6, key:0xFFD2A0, ki:1.7, hemi:0.62 },
  { t:0.26, name:'Morning',       top:0x6FA9CE, hor:0xDCEAF0, sun:0xFFF0CE, key:0xFFF1D8, ki:2.5, hemi:0.72 },
  { t:0.52, name:'Midday',        top:0x5D9FD4, hor:0xD9E9F2, sun:0xFFFBEE, key:0xFFFAEC, ki:2.9, hemi:0.80 },
  { t:0.74, name:'Afternoon',     top:0x6DA3C6, hor:0xEADFC8, sun:0xFFE7B4, key:0xFFE3B6, ki:2.4, hemi:0.70 },
  { t:0.90, name:'Golden hour',   top:0x7E9AC0, hor:0xF3CFA0, sun:0xFFC98A, key:0xFFC488, ki:2.0, hemi:0.58 },
  { t:1.00, name:'Early morning', top:0x7FA8C9, hor:0xF0DCC4, sun:0xFFD9A6, key:0xFFD2A0, ki:1.7, hemi:0.62 },
];
const _cA = new THREE.Color(), _cB = new THREE.Color();
function updateDay(dt){
  state.dayT += dt/DAY_LENGTH * (state.settings.calm ? 0.6 : 1);
  if(state.dayT >= 1){ state.dayT -= 1; state.day++; toast(`Day ${state.day} in the orchard`); save(); }
  const t = state.dayT;
  let i = 0; while(i < PHASES.length-2 && t > PHASES[i+1].t) i++;
  const a = PHASES[i], b = PHASES[i+1];
  const f = (t - a.t) / Math.max(1e-4, b.t - a.t);
  const mix = (ka,kb)=> _cA.setHex(ka).lerp(_cB.setHex(kb), f);

  skyUniforms.uTop.value.copy(mix(a.top,b.top));
  skyUniforms.uHorizon.value.copy(mix(a.hor,b.hor));
  skyUniforms.uSunCol.value.copy(mix(a.sun,b.sun));
  scene.fog.color.copy(skyUniforms.uHorizon.value);

  const elev = Math.sin(t*Math.PI)*0.86 + 0.12;
  const az = (t - 0.5) * 2.1;
  const sd = new THREE.Vector3(Math.sin(az)*0.9, Math.max(elev,0.08), Math.cos(az)*0.55).normalize();
  skyUniforms.uSunDir.value.copy(sd);
  key.position.copy(sd).multiplyScalar(30).add(character.position);
  key.target.position.copy(character.position);
  key.color.copy(mix(a.key,b.key));
  key.intensity = a.ki + (b.ki - a.ki)*f;
  hemi.intensity = a.hemi + (b.hemi - a.hemi)*f;

  $('clock').textContent = `${a.name} · Day ${state.day}`;
}

/* ============================================================
   Camera
   ============================================================ */
const camOffset = new THREE.Vector3(0, 9.6, 15.2);   // above the tallest crown, low enough to see down the row
const camLook = new THREE.Vector3();
const CAM_AIM = new THREE.Vector3(0, 1.8, -2.6);   // sit the horizon in frame
function updateCamera(dt){
  if(window.OH && window.OH.freeCam) return;   // console override for framing shots
  const desired = character.position.clone().add(camOffset);
  camera.position.lerp(desired, 1 - Math.pow(0.001, dt*(state.settings.calm?0.6:1)));
  camLook.lerp(character.position.clone().add(CAM_AIM), 1 - Math.pow(0.002, dt));
  camera.lookAt(camLook);
}
camera.position.copy(character.position).add(camOffset);
camLook.copy(character.position).add(CAM_AIM);

/* ============================================================
   Main loop
   ============================================================ */
const clock = new THREE.Clock();
let time = 0;
const _target = new THREE.Vector3(), _tmp = new THREE.Vector3();
const _camDir = new THREE.Vector3(), _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  const windScale = state.settings.calm ? 0.45 : 1;

  updateDay(dt);

  /* --- walking --- */
  let walking = false;
  if(moveTarget){
    _tmp.subVectors(moveTarget, character.position); _tmp.y = 0;
    const dist = _tmp.length();
    if(dist > ARRIVE_EPS){
      walking = true;
      _tmp.normalize();
      character.position.addScaledVector(_tmp, WALK_SPEED*dt);
      avoidTrunks(character.position);
      character.position.y = groundHeightAt(character.position.x, character.position.z);
      const ang = Math.atan2(_tmp.x, _tmp.z);
      let d = ang - character.rotation.y;
      while(d > Math.PI) d -= Math.PI*2; while(d < -Math.PI) d += Math.PI*2;
      character.rotation.y += d * Math.min(1, dt*9);
      walkT += dt*10;
    } else {
      character.position.x = moveTarget.x; character.position.z = moveTarget.z;
      character.position.y = groundHeightAt(moveTarget.x, moveTarget.z);
      moveTarget = null;
      if(queuedApple && !queuedApple.picked){ startPick(queuedApple); queuedApple = null; }
      if(queuedBarn){ queuedBarn = false; openBarn('sort'); }
    }
  }

  /* --- gait --- */
  if(walking){
    const s = Math.sin(walkT), c = Math.cos(walkT*2);
    rig.legL.rotation.x =  s*0.75;
    rig.legR.rotation.x = -s*0.75;
    rig.armR.rotation.x = -s*0.6;
    rig.armL.rotation.x = -0.30 + s*0.08;
    rig.torso.position.y = 0.52 + Math.abs(c)*0.022;
    rig.torso.rotation.z = s*0.035;
    rig.head.rotation.z = -s*0.05;
    rig.head.rotation.x = 0.04;
    rig.hat.rotation.z = -s*0.07;
    rig.basket.rotation.z = 0.16 + s*0.07;
  } else {
    const b = Math.sin(time*1.7)*0.5+0.5;
    rig.legL.rotation.x += (0 - rig.legL.rotation.x)*Math.min(1,dt*8);
    rig.legR.rotation.x += (0 - rig.legR.rotation.x)*Math.min(1,dt*8);
    rig.armL.rotation.x += (-0.30 - rig.armL.rotation.x)*Math.min(1,dt*8);
    rig.torso.position.y = 0.52 + b*0.012;
    rig.torso.rotation.z *= 0.9;
    rig.head.rotation.z *= 0.9;
    rig.head.rotation.x = 0.02 + Math.sin(time*1.1)*0.03;
    rig.hat.rotation.z *= 0.9;
    rig.basket.rotation.z += (0.16 - rig.basket.rotation.z)*Math.min(1,dt*6);
  }
  /* hop */
  hopV -= 9.5*dt; hop = Math.max(0, hop + hopV*dt);
  if(hop <= 0) hopV = Math.max(hopV, 0);
  bearRoot.position.y = hop*0.14;

  /* --- picking --- */
  for(const a of apples){
    if(!a.anim) continue;
    a.anim.t += dt;
    if(a.anim.phase === 'reach'){
      const p = Math.min(a.anim.t/0.40, 1);
      let d = a.anim.face - character.rotation.y;
      while(d > Math.PI) d -= Math.PI*2; while(d < -Math.PI) d += Math.PI*2;
      character.rotation.y += d*Math.min(1, dt*10);
      rig.armR.rotation.x = -p*2.3;
      rig.head.rotation.x = -p*0.45;
      if(p >= 1){
        a.picked = true;
        a.anim = { phase:'fly', t:0, from:a.group.getWorldPosition(new THREE.Vector3()) };
      }
    } else if(a.anim.phase === 'fly'){
      const p = Math.min(a.anim.t/0.5, 1);
      const e = 1 - Math.pow(1-p, 2.4);
      rig.basket.getWorldPosition(_basketWorld);
      _target.copy(a.anim.from).lerp(_basketWorld, e);
      _target.y += Math.sin(p*Math.PI)*0.55;                    // arc
      a.group.position.copy(_target).sub(a.treeGroup.position);
      a.group.rotation.x += dt*7; a.group.rotation.z += dt*4;
      a.group.scale.setScalar(APPLE_SCALE*(1 - 0.55*e));
      if(p >= 1){
        a.group.visible = false; a.anim = null;
        rig.armR.rotation.x = 0; rig.head.rotation.x = 0;
        finishPick(a);
      }
    }
  }

  /* --- idle sway on the fruit and the canopies --- */
  for(let i=0;i<apples.length;i++){
    const a = apples[i];
    if(a.picked || a.anim) continue;
    const s = Math.sin(time*1.6 + a.sway);
    a.group.position.y = a.home.y + s*0.018*windScale;
    a.group.rotation.z = s*0.10*windScale;
  }
  /* --- fade any canopy standing between the camera and the bear --- */
  _camDir.subVectors(character.position, camera.position);
  const camLen = _camDir.length();
  _camDir.divideScalar(camLen || 1);
  for(let i=0;i<trees.length;i++){
    const t = trees[i];
    t.rotation.z = Math.sin(time*0.55 + i*1.3)*0.006*windScale;
    t.rotation.x = Math.cos(time*0.47 + i*0.9)*0.005*windScale;

    const u = t.userData;
    _v1.set(t.position.x, t.position.y + u.canopyY, t.position.z).sub(camera.position);
    const along = _v1.dot(_camDir);
    let blocking = false;
    if(_v1.length() < u.canopyR + 2.2){
      blocking = true;                                   // camera is in among the leaves
    } else if(along > 0.4 && along < camLen - 0.8){
      const perp = _v2.copy(_camDir).multiplyScalar(along).sub(_v1).length();
      blocking = perp < u.canopyR + 1.1;
    }
    const want = blocking ? 0.16 : 1;
    if(Math.abs(u.fade - want) > 0.002){
      u.fade += (want - u.fade) * Math.min(1, dt*7);
      const clear = u.fade > 0.985;
      for(const m of u.canopyMats){
        m.opacity = u.fade; m.transparent = !clear; m.depthWrite = clear;
      }
      if(state.settings.outlines) u.outlines.forEach(o => o.visible = clear);
    }
  }
  /* --- clouds & petals --- */
  clouds.children.forEach(c => {
    c.position.x += c.userData.drift*dt*windScale;
    if(c.position.x > 78) c.position.x = -78;
  });
  if(state.settings.petals){
    const p = petalGeo.attributes.position;
    for(let i=0;i<PETAL_COUNT;i++){
      const v = petalVel[i];
      let y = p.getY(i) - v.fall*dt*windScale;
      let x = p.getX(i) + Math.sin(time*v.spin + v.drift)*0.9*dt*windScale + 0.25*dt*windScale;
      let z = p.getZ(i) + Math.cos(time*v.spin*0.7 + v.drift)*0.6*dt*windScale;
      if(y < 0){ y = 11 + Math.random()*3; x = (Math.random()-0.5)*54; z = (Math.random()-0.5)*54; }
      if(x > 30) x = -30;
      p.setXYZ(i, x, y, z);
    }
    p.needsUpdate = true;
  }

  /* keep the sky centred on the camera */
  sky.position.copy(camera.position);

  updateCamera(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  updateCameraFov();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(()=>{ if(hintShown) setHint('Tap an apple to pick it · tap the barn to go inside'); }, 100);
setTimeout(hideHint, 9000);
window.OH = { THREE, scene, camera, renderer, state, apples, trees, character, rig, barn };
animate();
</script>
</body>
</html>
